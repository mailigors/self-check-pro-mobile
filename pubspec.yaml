name: checklist_flutter
description: Self-Check Pro — мобильное приложение исполнителя.
publish_to: "none"
version: 1.0.0+3

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0
  dio: ^5.8.0
  flutter_secure_storage: ^9.2.4
  local_auth: ^3.0.2
  flutter_svg: ^2.1.0
  intl: ^0.20.2
  image_picker: ^1.1.2
  file_picker: ^10.1.2
  collection: ^1.19.1
  http_parser: ^4.1.2
  open_filex: ^4.7.0
  path_provider: ^2.1.6
  web: ^1.1.1
  mime: ^2.1.0
  share_plus: ^12.0.2
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shelf: ^1.4.2
  shelf_cors_headers: ^0.1.5

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
  fonts:
    - family: Manrope
      fonts:
        - asset: fonts/Manrope.ttf
