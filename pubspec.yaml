name: checklist_flutter
description: Self-Check Pro — мобильное приложение исполнителя.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0
  dio: ^5.8.0
  flutter_secure_storage: ^9.2.4
  flutter_svg: ^2.1.0
  intl: ^0.20.2
  image_picker: ^1.1.2
  file_picker: ^10.1.2
  collection: ^1.19.1
  http_parser: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shelf: ^1.4.2
  shelf_cors_headers: ^0.1.5

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
  fonts:
    - family: Poppins
      fonts:
        - asset: fonts/Poppins-Regular.ttf
          weight: 400
        - asset: fonts/Poppins-Medium.ttf
          weight: 500
        - asset: fonts/Poppins-SemiBold.ttf
          weight: 600
