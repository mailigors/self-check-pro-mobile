name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve base href
        id: base
        run: |
          REPO="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          if [ "$REPO" = "${OWNER}.github.io" ]; then
            echo "href=/" >> "$GITHUB_OUTPUT"
          else
            echo "href=/${REPO}/" >> "$GITHUB_OUTPUT"
          fi

      - run: flutter pub get

      - name: Build web
        env:
          API_ORIGIN: ${{ vars.API_ORIGIN }}
        run: |
          ORIGIN="${API_ORIGIN:-http://185.108.211.9:3002}"
          flutter build web --release \
            --base-href "${{ steps.base.outputs.href }}" \
            --no-web-resources-cdn \
            --dart-define="API_ORIGIN=$ORIGIN"

      - name: Prepare GitHub Pages
        run: |
          touch build/web/.nojekyll
          cp build/web/index.html build/web/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
